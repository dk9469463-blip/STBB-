<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Government of Sindh Official Emerald Green & Gold Gradients -->
    <linearGradient id="sindhGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006c35" />
      <stop offset="50%" stop-color="#004d25" />
      <stop offset="100%" stop-color="#003319" />
    </linearGradient>

    <linearGradient id="sindhGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="govShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Seal Ring -->
  <circle cx="250" cy="250" r="236" fill="#ffffff" stroke="url(#sindhGoldGrad)" stroke-width="8" filter="url(#govShadow)" />
  <circle cx="250" cy="250" r="222" fill="url(#sindhGreenGrad)" stroke="url(#sindhGoldGrad)" stroke-width="3" />
  <circle cx="250" cy="250" r="168" fill="#ffffff" stroke="url(#sindhGoldGrad)" stroke-width="4" />

  <!-- Circular Outer Text: Top "GOVERNMENT OF SINDH" and Bottom "حکومت سندھ" -->
  <path id="textCircleTop" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#fde047" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      GOVERNMENT OF SINDH
    </textPath>
  </text>

  <path id="textCircleBottom" d="M 432 250 A 182 182 0 0 1 68 250" fill="none" />
  <text font-family="'Noto Naskh Arabic', sans-serif" font-size="24" font-weight="700" fill="#fde047">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      حکومتِ سنڌ • حڪومت سنڌ
    </textPath>
  </text>

  <!-- Side Stars in Outer Ring -->
  <polygon points="58,250 63,242 71,242 65,248 67,256 60,251 53,256 55,248 49,242 57,242" fill="#fde047" />
  <polygon points="442,250 447,242 455,242 449,248 451,256 444,251 437,256 439,248 433,242 441,242" fill="#fde047" />

  <!-- Inner Crest: Crescent and Star at Top -->
  <g transform="translate(0, -10)">
    <!-- Crescent -->
    <path d="M 250 112 A 28 28 0 1 0 274 150 A 23 23 0 1 1 250 112 Z" fill="#005a2b" stroke="url(#sindhGoldGrad)" stroke-width="1.5" />
    <!-- Star -->
    <polygon points="266,128 270,120 274,128 282,128 276,133 278,141 271,136 264,141 266,133 260,128" fill="#eab308" />
  </g>

  <!-- Central Heraldic Shield (The River Indus Meander and Sunrise/Fertile Lands of Sindh) -->
  <g transform="translate(0, 10)">
    <!-- Shield Outline -->
    <path d="M 180 180 C 180 180, 250 165, 320 180 C 320 235, 315 285, 250 320 C 185 285, 180 235, 180 180 Z"
          fill="#f8fafc" stroke="url(#sindhGreenGrad)" stroke-width="6" />

    <!-- Shield Inner Decorative Border -->
    <path d="M 188 188 C 220 176, 280 176, 312 188 C 312 230, 307 275, 250 308 C 193 275, 188 230, 188 188 Z"
          fill="none" stroke="url(#sindhGoldGrad)" stroke-width="2" />

    <!-- River Indus Waves (Meander) in Shield -->
    <path d="M 194 250 Q 222 235 250 250 T 306 250 L 306 270 C 290 285 270 298 250 305 C 230 298 210 285 194 270 Z"
          fill="#006c35" />
    <path d="M 194 250 Q 222 235 250 250 T 306 250" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
    <path d="M 200 262 Q 225 248 250 262 T 300 262" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Sun and Rays above Indus River -->
    <circle cx="250" cy="216" r="14" fill="#eab308" />
    <line x1="250" y1="194" x2="250" y2="186" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
    <line x1="266" y1="200" x2="272" y2="194" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
    <line x1="272" y1="216" x2="280" y2="216" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
    <line x1="234" y1="200" x2="228" y2="194" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
    <line x1="228" y1="216" x2="220" y2="216" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wreath / Babul (Acacia nilotica) & Olive Branches Surrounding Shield -->
  <g stroke="url(#sindhGreenGrad)" fill="#005a2b" stroke-width="1.5">
    <!-- Left Branch Leaves -->
    <path d="M 166 220 Q 150 205 138 220 Q 152 230 166 220 Z" />
    <path d="M 160 245 Q 142 235 134 250 Q 150 258 160 245 Z" />
    <path d="M 164 272 Q 146 268 142 284 Q 158 288 164 272 Z" />
    <path d="M 178 296 Q 164 298 164 314 Q 180 312 178 296 Z" />
    <path d="M 204 318 Q 192 324 196 340 Q 210 334 204 318 Z" />

    <!-- Right Branch Leaves -->
    <path d="M 334 220 Q 350 205 362 220 Q 348 230 334 220 Z" />
    <path d="M 340 245 Q 358 235 366 250 Q 350 258 340 245 Z" />
    <path d="M 336 272 Q 354 268 358 284 Q 342 288 336 272 Z" />
    <path d="M 322 296 Q 336 298 336 314 Q 320 312 322 296 Z" />
    <path d="M 296 318 Q 308 324 304 340 Q 290 334 296 318 Z" />

    <!-- Connecting Stems -->
    <path d="M 148 215 C 130 270, 160 335, 240 348" fill="none" stroke="#004d25" stroke-width="3" stroke-linecap="round" />
    <path d="M 352 215 C 370 270, 340 335, 260 348" fill="none" stroke="#004d25" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Bottom Golden Knot -->
  <circle cx="250" cy="348" r="6" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
</svg>
