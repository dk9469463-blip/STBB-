<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Blue to Deep Navy Gradient -->
    <linearGradient id="stbbRoyalNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Refined Gold Accent Gradient -->
    <linearGradient id="stbbGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Pristine Crisp Page Gradient -->
    <linearGradient id="stbbPageL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="stbbPageR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Badge Base in Deep Navy & Royal Blue -->
  <circle cx="256" cy="256" r="230" fill="url(#stbbRoyalNavy)" filter="url(#logoShadow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#stbbGoldAccent)" stroke-width="4" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4" />

  <!-- Sindh Geometric Heritage Star / Spark of Knowledge at Top -->
  <g transform="translate(0, 10)">
    <!-- 8-point geometric star -->
    <path d="M 256 70 L 263 92 L 285 92 L 267 105 L 274 126 L 256 113 L 238 126 L 245 105 L 227 92 L 249 92 Z"
          fill="url(#stbbGoldAccent)" filter="url(#logoShadow)" />
  </g>

  <!-- Open Book Emblem -->
  <g filter="url(#logoShadow)" transform="translate(0, 16)">
    <!-- Book Outer Cover / Binding in Deep Navy -->
    <path d="M 256 376 C 220 354 154 348 88 368 L 88 226 C 154 206 220 214 256 236 C 292 214 358 206 424 226 L 424 368 C 358 348 292 354 256 376 Z"
          fill="#090d16" stroke="url(#stbbGoldAccent)" stroke-width="3" />

    <!-- Left Page Leaf -->
    <path d="M 256 360 C 224 340 162 334 98 352 L 98 214 C 162 196 224 202 256 222 Z"
          fill="url(#stbbPageL)" />

    <!-- Right Page Leaf -->
    <path d="M 256 360 C 288 340 350 334 414 352 L 414 214 C 350 196 288 202 256 222 Z"
          fill="url(#stbbPageR)" />

    <!-- Center Spine & Bookmark Ribbon in Gold -->
    <path d="M 254 220 L 258 220 L 258 376 L 254 376 Z" fill="url(#stbbGoldAccent)" />
    <!-- Golden Ribbon Marker -->
    <path d="M 256 220 C 266 260 270 300 280 340 L 272 344 L 264 330 L 256 344 Z" fill="url(#stbbGoldAccent)" opacity="0.95" />

    <!-- Subtle Textbook Printed Rule Lines (Left) -->
    <line x1="126" y1="244" x2="230" y2="249" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <line x1="126" y1="268" x2="230" y2="273" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <line x1="126" y1="292" x2="230" y2="297" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <line x1="126" y1="316" x2="200" y2="320" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- Subtle Textbook Printed Rule Lines (Right) -->
    <line x1="282" y1="249" x2="386" y2="244" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <line x1="282" y1="273" x2="386" y2="268" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <line x1="282" y1="297" x2="386" y2="292" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <line x1="312" y1="320" x2="386" y2="316" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Typography Arc at Bottom of Badge -->
  <path id="badgeArc" d="M 120 420 A 190 190 0 0 0 392 420" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#fde047" letter-spacing="4">
    <textPath href="#badgeArc" startOffset="50%" text-anchor="middle">
      STBB BOOKS
    </textPath>
  </text>
</svg>
