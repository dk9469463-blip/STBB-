<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">STBB Books</title>
  <desc id="desc">An open book and a golden learning spark on a deep navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174a91"/><stop offset=".55" stop-color="#0b2450"/><stop offset="1" stop-color="#041126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b9"/><stop offset=".5" stop-color="#f7c45c"/><stop offset="1" stop-color="#dd8e20"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/><stop offset="1" stop-color="#a9d8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#020817" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="105" fill="url(#bg)"/>
  <rect x="23" y="23" width="466" height="466" rx="94" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="36" y="36" width="440" height="440" rx="82" fill="none" stroke="#8ec9ff" stroke-opacity=".18" stroke-width="2"/>
  <!-- A little Sindhi-inspired diamond ornament, used as a learning spark. -->
  <path d="M355 86 365 108 388 118 365 128 355 151 345 128 322 118 345 108Z" fill="url(#gold)"/>
  <path d="M402 155 408 168 422 174 408 180 402 194 396 180 382 174 396 168Z" fill="#8ce4ef"/>
  <path d="M125 136 132 151 148 158 132 165 125 181 118 165 102 158 118 151Z" fill="#f7c45c" opacity=".8"/>
  <!-- Open pages: the central valley and upward page corners form a distinct book mark. -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M76 203 Q145 185 226 216 Q242 222 256 239 L256 374 Q237 353 218 348 Q151 331 76 354Z" fill="#06162e" stroke="#f7c45c" stroke-width="9"/>
    <path d="M436 203 Q367 185 286 216 Q270 222 256 239 L256 374 Q275 353 294 348 Q361 331 436 354Z" fill="#06162e" stroke="#f7c45c" stroke-width="9"/>
    <path d="M91 216 Q156 201 226 229 Q240 234 247 248 L247 351 Q227 337 211 334 Q150 318 91 340Z" fill="url(#pageL)"/>
    <path d="M421 216 Q356 201 286 229 Q272 234 265 248 L265 351 Q285 337 301 334 Q362 318 421 340Z" fill="url(#pageR)"/>
    <path d="M256 241 L256 374" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Page lines make the symbol read as a book at small icon sizes. -->
  <g fill="none" stroke-linecap="round" stroke-width="6">
    <path d="M119 246 Q171 239 216 259" stroke="#79a9dc"/>
    <path d="M119 271 Q173 266 216 284" stroke="#79a9dc"/>
    <path d="M119 296 Q171 292 216 310" stroke="#79a9dc"/>
    <path d="M393 246 Q341 239 296 259" stroke="#4384c3"/>
    <path d="M393 271 Q339 266 296 284" stroke="#4384c3"/>
    <path d="M393 296 Q341 292 296 310" stroke="#4384c3"/>
  </g>
  <path d="M160 390 H352" stroke="#8cc8ff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="438" fill="#ffffff" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="7" text-anchor="middle">STBB</text>
  <text x="256" y="461" fill="#d8e8ff" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3.2" text-anchor="middle">BOOKS • LEARN • GROW</text>
</svg>