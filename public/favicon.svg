<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="stbb-title stbb-desc">
  <title id="stbb-title">STBB Books — Sindh Knowledge Mark</title>
  <desc id="stbb-desc">An original mark inspired by the Sindhi Ajrak pattern, a rising sun and the flowing Indus River.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f82"/>
      <stop offset=".52" stop-color="#0b2450"/>
      <stop offset="1" stop-color="#06152e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b7"/>
      <stop offset=".48" stop-color="#f6bd42"/>
      <stop offset="1" stop-color="#d78a16"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7e9ff"/>
      <stop offset=".52" stop-color="#55c4df"/>
      <stop offset="1" stop-color="#f6bd42"/>
    </linearGradient>
    <radialGradient id="sun" cx=".38" cy=".28" r=".8">
      <stop offset="0" stop-color="#fff1bf"/>
      <stop offset=".55" stop-color="#f6bd42"/>
      <stop offset="1" stop-color="#db8a18"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020817" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#navy)"/>
  <rect x="23" y="23" width="466" height="466" rx="101" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="35" y="35" width="442" height="442" rx="89" fill="none" stroke="#7eb7ff" stroke-opacity=".2" stroke-width="2"/>

  <!-- Ajrak-inspired compass diamonds: a small, original Sindhi cultural accent. -->
  <g fill="url(#gold)">
    <path d="M256 65 278 87 256 109 234 87Z"/>
    <path d="M211 98 224 111 211 124 198 111Z" opacity=".86"/>
    <path d="M301 98 314 111 301 124 288 111Z" opacity=".86"/>
    <path d="M177 143 186 152 177 161 168 152Z" opacity=".6"/>
    <path d="M335 143 344 152 335 161 326 152Z" opacity=".6"/>
  </g>

  <!-- Rising sun — a symbol of possibility and learning. -->
  <circle cx="256" cy="189" r="65" fill="#f6bd42" opacity=".14" filter="url(#glow)"/>
  <circle cx="256" cy="183" r="51" fill="url(#sun)" filter="url(#shadow)"/>
  <path d="M218 183a38 38 0 0 1 76 0" fill="none" stroke="#fff4cf" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <g stroke="#ffe7a0" stroke-width="5" stroke-linecap="round">
    <path d="M256 116v-10"/>
    <path d="m218 132-7-8"/>
    <path d="m294 132 7-8"/>
    <path d="m199 168-10-2"/>
    <path d="m313 168 10-2"/>
  </g>

  <!-- Three flowing ribbons evoke the Indus, motion and shared knowledge. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 270c44-28 86 28 130 0s87-28 130 0 43 28 68 10" stroke="#06152d" stroke-width="24" opacity=".7"/>
    <path d="M92 266c44-28 86 28 130 0s87-28 130 0 43 28 68 10" stroke="url(#river)" stroke-width="13"/>
    <path d="M108 311c38-23 75 23 113 0s75-23 113 0 48 23 70 7" stroke="#06152d" stroke-width="22" opacity=".6"/>
    <path d="M108 307c38-23 75 23 113 0s75-23 113 0 48 23 70 7" stroke="#8adcf2" stroke-width="11"/>
    <path d="M132 352c31-18 62 18 93 0s63-18 94 0 51 17 73 4" stroke="#06152d" stroke-width="20" opacity=".6"/>
    <path d="M132 348c31-18 62 18 93 0s63-18 94 0 51 17 73 4" stroke="url(#gold)" stroke-width="9"/>
  </g>

  <path d="M148 393h216" stroke="#7eb7ff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="432" fill="#fff" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="7" text-anchor="middle">STBB</text>
  <text x="256" y="457" fill="#d9e9ff" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="4" text-anchor="middle">SINDH KNOWLEDGE</text>
</svg>
