name: SindhLearn Automated Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sindhlearn-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build, TypeScript and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Automated browser smoke tests
        run: npm run test:e2e
