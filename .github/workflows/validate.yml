name: Validate STBB Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Smoke test development server
        env:
          PORT: 4174
        run: |
          npm run dev > /tmp/stbb-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              echo "Development server responded successfully."
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/stbb-server.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/stbb-server.log
          echo "Development server did not respond within 30 seconds."
          exit 1
